<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notion Widgets Collection</title>
    <!-- Favicon: A Toolbox Emoji 🧰 -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧰</text></svg>"
    />

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: "var(--brand-color)",
              brandHover: "var(--brand-hover)",
              brandLight: "var(--brand-light)",
              brandText: "var(--brand-text)",
              darkBg: "#111827",
              darkSurface: "#1f2937",
              darkBorder: "#374151",
            },
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                "Segoe UI",
                "Helvetica",
                "Apple Color Emoji",
                "Arial",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>

    <style>
      /* Shared Root Variables from Pipeline Timer */
      :root {
        /* Default Purple Theme */
        --brand-color: #a855f7; /* purple-500 */
        --brand-hover: #9333ea; /* purple-600 */
        --brand-light: #faf5ff; /* purple-50 */
        --brand-text: #6b21a8; /* purple-800 */
      }

      /* Dark mode support logic handled by Tailwind .dark class, but we keep vars for consistency */

      /* Theme Overrides */
      [data-theme="blue"] {
        --brand-color: #3b82f6;
        --brand-hover: #2563eb;
        --brand-light: #eff6ff;
        --brand-text: #1e40af;
      }

      [data-theme="orange"] {
        --brand-color: #f97316;
        --brand-hover: #ea580c;
        --brand-light: #fff7ed;
        --brand-text: #9a3412;
      }

      [data-theme="green"] {
        --brand-color: #22c55e;
        --brand-hover: #16a34a;
        --brand-light: #f0fdf4;
        --brand-text: #166534;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
          "Apple Color Emoji", Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        transition:
          background-color 0.3s,
          color 0.3s;
      }

      .container {
        width: 100%;
        max-width: 600px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 8px;
        font-weight: 700;
      }

      p {
        color: var(--text-color);
        opacity: 0.7;
        margin-bottom: 30px;
        font-size: 16px;
      }

      .widget-list {
        list-style: none;
        padding: 0;
        margin: 0;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
      }

      .widget-item {
        border-bottom: 1px solid var(--border-color);
      }

      .widget-item:last-child {
        border-bottom: none;
      }

      .widget-link {
        display: flex;
        align-items: center;
        padding: 16px 20px;
        text-decoration: none;
        color: var(--text-color);
        background-color: var(--bg-color);
        transition: background-color 0.2s ease;
      }

      .widget-link:hover {
        background-color: var(--hover-bg);
      }

      .icon {
        font-size: 24px;
        margin-right: 15px;
      }

      .info {
        display: flex;
        flex-direction: column;
      }

      .name {
        font-weight: 600;
        font-size: 16px;
        margin-bottom: 2px;
      }

      .desc {
        font-size: 14px;
        opacity: 0.6;
      }
    </style>
  </head>
  <body
    class="bg-gray-50 dark:bg-darkBg text-gray-800 dark:text-gray-100 min-h-screen flex flex-col items-center py-10 px-5 font-sans transition-colors duration-300"
  >
    <div class="fixed top-4 right-4 flex gap-3 z-50">
      <button
        onclick="toggleDarkMode()"
        class="p-2 rounded-full bg-white dark:bg-darkSurface shadow-md text-gray-600 dark:text-gray-300 hover:text-brand transition"
      >
        <i class="fa-solid fa-moon dark:hidden"></i>
        <i class="fa-solid fa-sun hidden dark:inline"></i>
      </button>
      <div class="group relative">
        <button
          class="p-2 rounded-full bg-white dark:bg-darkSurface shadow-md text-brand hover:text-brandHover transition"
        >
          <i class="fa-solid fa-palette"></i>
        </button>
        <!-- Connector div with padding-top (pt-2) to bridge the gap -->
        <div class="absolute right-0 pt-2 w-32 hidden group-hover:block z-50">
          <div
            class="bg-white dark:bg-darkSurface rounded-lg shadow-xl border border-gray-100 dark:border-darkBorder p-2 grid grid-cols-4 gap-1"
          >
            <button
              onclick="setTheme('blue')"
              class="w-6 h-6 rounded-full bg-blue-500 hover:scale-110 transition"
            ></button>
            <button
              onclick="setTheme('purple')"
              class="w-6 h-6 rounded-full bg-purple-500 hover:scale-110 transition"
            ></button>
            <button
              onclick="setTheme('orange')"
              class="w-6 h-6 rounded-full bg-orange-500 hover:scale-110 transition"
            ></button>
            <button
              onclick="setTheme('green')"
              class="w-6 h-6 rounded-full bg-green-500 hover:scale-110 transition"
            ></button>
          </div>
        </div>
      </div>
    </div>

    <div class="w-full max-w-2xl">
      <h1 class="text-3xl font-bold mb-2 text-gray-900 dark:text-white">
        Notion Widgets
      </h1>
      <p class="text-gray-500 dark:text-gray-400 mb-8 text-lg">
        A personal collection of custom HTML tools.
      </p>

      <ul
        class="rounded-xl border border-gray-200 dark:border-darkBorder overflow-hidden bg-white dark:bg-darkSurface shadow-sm"
      >
        <!-- Time Calculator -->
        <li
          class="border-b border-gray-100 dark:border-darkBorder last:border-none"
        >
          <a
            href="./time-calculator/"
            class="flex items-center p-5 hover:bg-brandLight dark:hover:bg-gray-800/50 transition duration-200 group"
          >
            <span
              class="text-3xl mr-5 group-hover:scale-110 transition duration-200"
              >⏰</span
            >
            <div class="flex flex-col">
              <span
                class="font-bold text-gray-800 dark:text-gray-200 text-lg mb-1 group-hover:text-brand transition"
                >Time Calculator</span
              >
              <span class="text-sm text-gray-500 dark:text-gray-400"
                >Calculate future times based on current time + duration.</span
              >
            </div>
            <i
              class="fa-solid fa-chevron-right ml-auto text-gray-300 group-hover:text-brand transition"
            ></i>
          </a>
        </li>

        <!-- Pipeline Timer -->
        <li
          class="border-b border-gray-100 dark:border-darkBorder last:border-none"
        >
          <a
            href="./pipeline-timer/"
            class="flex items-center p-5 hover:bg-brandLight dark:hover:bg-gray-800/50 transition duration-200 group"
          >
            <span
              class="text-3xl mr-5 group-hover:scale-110 transition duration-200"
              >🧩</span
            >
            <div class="flex flex-col">
              <span
                class="font-bold text-gray-800 dark:text-gray-200 text-lg mb-1 group-hover:text-brand transition"
                >Pipeline Timer</span
              >
              <span class="text-sm text-gray-500 dark:text-gray-400"
                >Track and manage task pipeline timing with visual
                progress.</span
              >
            </div>
            <i
              class="fa-solid fa-chevron-right ml-auto text-gray-300 group-hover:text-brand transition"
            ></i>
          </a>
        </li>

        <!-- Add new widgets here... -->
      </ul>
    </div>

    <script>
      // Check for saved theme preference
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }

      function toggleDarkMode() {
        if (document.documentElement.classList.contains("dark")) {
          document.documentElement.classList.remove("dark");
          localStorage.theme = "light";
        } else {
          document.documentElement.classList.add("dark");
          localStorage.theme = "dark";
        }
      }

      function setTheme(colorName) {
        document.documentElement.removeAttribute("data-theme");
        if (colorName !== "purple") {
          // Default
          document.documentElement.setAttribute("data-theme", colorName);
        }
        localStorage.setItem("colorTheme", colorName);
      }

      // Load saved color theme
      const savedColor = localStorage.getItem("colorTheme");
      if (savedColor) setTheme(savedColor);
    </script>
  </body>
</html>
