<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Offset Calculator</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #37352f;
            --input-bg: #f7f9fb;
            --border-color: #e6e6e6;
            --accent-color: #2383e2;
        }

        /* Dark mode support for Notion */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #191919;
                --text-color: #d4d4d4;
                --input-bg: #2d2d2d;
                --border-color: #3f3f3f;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.7;
            margin-bottom: 4px;
            display: block;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .result-box {
            margin-top: 10px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(35, 131, 226, 0.1);
            border: 1px solid rgba(35, 131, 226, 0.2);
            text-align: center;
        }

        .result-label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        #result-time {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-color);
        }

        /* Remove spinner arrows from number inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div>
            <label for="startTime">Start Time</label>
            <input type="time" id="startTime">
        </div>

        <div class="input-group">
            <div style="flex: 1;">
                <label for="addHours">Add Hours</label>
                <input type="number" id="addHours" placeholder="0" min="0">
            </div>
            <div style="flex: 1;">
                <label for="addMinutes">Add Minutes</label>
                <input type="number" id="addMinutes" placeholder="0" min="0">
            </div>
        </div>

        <div class="result-box">
            <div class="result-label">The time will be</div>
            <div id="result-time">--:--</div>
        </div>

    </div>

    <script>
        const startTimeInput = document.getElementById('startTime');
        const addHoursInput = document.getElementById('addHours');
        const addMinutesInput = document.getElementById('addMinutes');
        const resultDisplay = document.getElementById('result-time');

        // Initialize with current time
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        startTimeInput.value = `${hours}:${minutes}`;

        function calculateTime() {
            if (!startTimeInput.value) return;

            // Get start time values
            const [startHours, startMinutes] = startTimeInput.value.split(':').map(Number);
            
            // Get duration values (default to 0 if empty)
            const addH = parseInt(addHoursInput.value) || 0;
            const addM = parseInt(addMinutesInput.value) || 0;

            // Create date object and set time
            const date = new Date();
            date.setHours(startHours);
            date.setMinutes(startMinutes);

            // Add duration
            date.setHours(date.getHours() + addH);
            date.setMinutes(date.getMinutes() + addM);

            // Format Output (12-hour format with AM/PM)
            let finalHours = date.getHours();
            const finalMinutes = String(date.getMinutes()).padStart(2, '0');
            const ampm = finalHours >= 12 ? 'PM' : 'AM';

            finalHours = finalHours % 12;
            finalHours = finalHours ? finalHours : 12; // the hour '0' should be '12'

            resultDisplay.textContent = `${finalHours}:${finalMinutes} ${ampm}`;
        }

        // Add event listeners to trigger calculation on any change
        startTimeInput.addEventListener('input', calculateTime);
        addHoursInput.addEventListener('input', calculateTime);
        addMinutesInput.addEventListener('input', calculateTime);

        // Initial calculation
        calculateTime();
    </script>
</body>
</html>
