<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Offset Calculator</title>
    <!-- Favicon: A Clock Emoji ⏰ -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏰</text></svg>"
    />

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: "var(--brand-color)",
              brandHover: "var(--brand-hover)",
              brandLight: "var(--brand-light)",
              brandText: "var(--brand-text)",
              darkBg: "#111827",
              darkSurface: "#1f2937",
              darkBorder: "#374151",
            },
          },
        },
      };
    </script>

    <style>
      :root {
        /* Default Purple Theme */
        --brand-color: #a855f7;
        --brand-hover: #9333ea;
        --brand-light: #faf5ff;
        --brand-text: #6b21a8;
      }

      /* Theme Overrides */
      [data-theme="blue"] {
        --brand-color: #3b82f6;
        --brand-hover: #2563eb;
        --brand-text: #1e40af;
        --brand-light: #eff6ff;
      }

      [data-theme="orange"] {
        --brand-color: #f97316;
        --brand-hover: #ea580c;
        --brand-text: #9a3412;
        --brand-light: #fff7ed;
      }

      [data-theme="green"] {
        --brand-color: #22c55e;
        --brand-hover: #16a34a;
        --brand-text: #166534;
        --brand-light: #f0fdf4;
      }

      /* Remove spinner arrows from number inputs */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>
  </head>
  <body
    class="bg-gray-50 dark:bg-darkBg text-gray-800 dark:text-gray-100 flex flex-col items-center justify-center min-h-screen px-5 font-sans transition-colors duration-300"
  >
    <div class="fixed top-4 right-4 flex gap-3 z-50">
      <button
        onclick="toggleDarkMode()"
        class="p-2 rounded-full bg-white dark:bg-darkSurface shadow-md text-gray-600 dark:text-gray-300 hover:text-brand transition"
      >
        <i class="fa-solid fa-moon dark:hidden"></i>
        <i class="fa-solid fa-sun hidden dark:inline"></i>
      </button>
      <div class="group relative">
        <button
          class="p-2 rounded-full bg-white dark:bg-darkSurface shadow-md text-brand hover:text-brandHover transition"
        >
          <i class="fa-solid fa-palette"></i>
        </button>
        <!-- Connector div with padding-top (pt-2) to bridge the gap -->
        <div class="absolute right-0 pt-2 w-32 hidden group-hover:block z-50">
          <div
            class="bg-white dark:bg-darkSurface rounded-lg shadow-xl border border-gray-100 dark:border-darkBorder p-2 grid grid-cols-4 gap-1"
          >
            <button
              onclick="setTheme('blue')"
              class="w-6 h-6 rounded-full bg-blue-500 hover:scale-110 transition"
            ></button>
            <button
              onclick="setTheme('purple')"
              class="w-6 h-6 rounded-full bg-purple-500 hover:scale-110 transition"
            ></button>
            <button
              onclick="setTheme('orange')"
              class="w-6 h-6 rounded-full bg-orange-500 hover:scale-110 transition"
            ></button>
            <button
              onclick="setTheme('green')"
              class="w-6 h-6 rounded-full bg-green-500 hover:scale-110 transition"
            ></button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="w-full max-w-sm bg-white dark:bg-darkSurface p-8 rounded-2xl shadow-xl border border-gray-100 dark:border-darkBorder"
    >
      <div
        class="flex items-center gap-3 mb-6 pb-4 border-b border-gray-100 dark:border-darkBorder"
      >
        <span class="text-2xl">⏰</span>
        <h1 class="text-xl font-bold text-gray-900 dark:text-white">
          Time Calculator
        </h1>
      </div>

      <div class="flex flex-col gap-5">
        <!-- Start Time -->
        <div>
          <label
            for="startTime"
            class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2"
            >Start Time</label
          >
          <input
            type="time"
            id="startTime"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-darkBorder bg-gray-50 dark:bg-darkBg dark:text-white text-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none transition"
          />
        </div>

        <!-- Duration Inputs -->
        <div class="flex gap-4">
          <div class="flex-1">
            <label
              for="addHours"
              class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2"
              >Hours</label
            >
            <input
              type="number"
              id="addHours"
              placeholder="0"
              min="0"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-darkBorder bg-gray-50 dark:bg-darkBg dark:text-white text-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none transition text-center"
            />
          </div>
          <div class="flex-1">
            <label
              for="addMinutes"
              class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2"
              >Minutes</label
            >
            <input
              type="number"
              id="addMinutes"
              placeholder="0"
              min="0"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-darkBorder bg-gray-50 dark:bg-darkBg dark:text-white text-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none transition text-center"
            />
          </div>
        </div>

        <!-- Result -->
        <div
          class="mt-4 p-5 rounded-xl bg-brandLight dark:bg-darkBg border border-brand/20 dark:border-darkBorder text-center"
        >
          <div
            class="text-xs text-brand/60 dark:text-brand/40 font-bold uppercase tracking-wider mb-1"
          >
            Result
          </div>
          <div id="result-time" class="text-3xl font-bold text-brand font-mono">
            --:--
          </div>
        </div>
      </div>
    </div>

    <script>
      const startTimeInput = document.getElementById("startTime");
      const addHoursInput = document.getElementById("addHours");
      const addMinutesInput = document.getElementById("addMinutes");
      const resultDisplay = document.getElementById("result-time");

      // Dark Mode & Theme Logic
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }

      function toggleDarkMode() {
        if (document.documentElement.classList.contains("dark")) {
          document.documentElement.classList.remove("dark");
          localStorage.theme = "light";
        } else {
          document.documentElement.classList.add("dark");
          localStorage.theme = "dark";
        }
      }

      function setTheme(colorName) {
        document.documentElement.removeAttribute("data-theme");
        if (colorName !== "purple") {
          document.documentElement.setAttribute("data-theme", colorName);
        }
        localStorage.setItem("colorTheme", colorName);
      }

      const savedColor = localStorage.getItem("colorTheme");
      if (savedColor) setTheme(savedColor);

      // Initialize with current time
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      startTimeInput.value = `${hours}:${minutes}`;

      function calculateTime() {
        if (!startTimeInput.value) return;

        // Get start time values
        const [startHours, startMinutes] = startTimeInput.value
          .split(":")
          .map(Number);

        // Get duration values (default to 0 if empty)
        const addH = parseInt(addHoursInput.value) || 0;
        const addM = parseInt(addMinutesInput.value) || 0;

        // Create date object and set time
        const date = new Date();
        date.setHours(startHours);
        date.setMinutes(startMinutes);

        // Add duration
        date.setHours(date.getHours() + addH);
        date.setMinutes(date.getMinutes() + addM);

        // Format Output (12-hour format with AM/PM)
        let finalHours = date.getHours();
        const finalMinutes = String(date.getMinutes()).padStart(2, "0");
        const ampm = finalHours >= 12 ? "PM" : "AM";

        finalHours = finalHours % 12;
        finalHours = finalHours ? finalHours : 12; // the hour '0' should be '12'

        resultDisplay.textContent = `${finalHours}:${finalMinutes} ${ampm}`;
      }

      // Add event listeners to trigger calculation on any change
      startTimeInput.addEventListener("input", calculateTime);
      addHoursInput.addEventListener("input", calculateTime);
      addMinutesInput.addEventListener("input", calculateTime);

      // Initial calculation
      calculateTime();
    </script>
  </body>
</html>
